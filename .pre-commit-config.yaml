repos:
  - repo: local
    hooks:
      - id: biome-check
        name: Biome lint + format
        language: system
        entry: pnpm exec biome check --write
        types_or: [ts, javascript, json]
        pass_filenames: true

  - repo: conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
