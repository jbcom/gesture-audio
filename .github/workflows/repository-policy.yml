name: Repository Policy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dependabot-policy:
    name: Trusted Dependabot policy reporter
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Report policy from trusted GitHub metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request_target' || run.conclusion !== 'success') return;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            let numbers = (run.pull_requests ?? []).map(({ number }) => number);
            if (numbers.length === 0) {
              const candidates = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${run.head_branch}`,
                per_page: 100,
              });
              numbers = candidates.filter((pr) => pr.head.sha === run.head_sha).map(({ number }) => number);
            }
            for (const number of numbers) {
              const get = async () => (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data;
              const pr = await get();
              if (pr.state !== 'open' || pr.user.login !== 'dependabot[bot]' || pr.head.repo.full_name !== repository || pr.head.sha !== run.head_sha) continue;
              const targets = new Set([pr.head.sha]);
              const report = async (state, description) => {
                for (const sha of targets) await github.rest.repos.createCommitStatus({
                  ...context.repo,
                  sha,
                  context: 'Repository Policy / gate',
                  state,
                  description,
                  target_url: `${context.serverUrl}/${repository}/actions/runs/${context.runId}`,
                });
              };
              await report('pending', 'Verifying trusted Dependabot policy');
              try {
                let current;
                for (let attempt = 0; attempt < 18; attempt++) {
                  current = await get();
                  if (current.head.sha !== pr.head.sha) throw new Error('PR head changed during policy reporting');
                  if (current.merge_commit_sha) break;
                  if (attempt < 17) {
                    const delay = Math.min(1000 * 2 ** attempt, 15000);
                    await new Promise((resolve) => setTimeout(resolve, delay));
                  }
                }
                if (!current.merge_commit_sha) throw new Error('PR test merge commit is unavailable');
                targets.add(current.merge_commit_sha);
                await report('pending', 'Verifying trusted Dependabot policy');
                const latest = await get();
                if (latest.head.sha !== pr.head.sha || latest.merge_commit_sha !== current.merge_commit_sha) {
                  throw new Error('PR changed during policy reporting');
                }
                await report('success', 'Trusted Dependabot repository policy passed');
              } catch (error) {
                await report('error', 'Trusted Dependabot policy could not complete');
                throw error;
              }
            }
