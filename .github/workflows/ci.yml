name: CI

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Lets `gh workflow run ci.yml --ref <branch>` re-fire CI when a transient
  # infra hiccup (runner queue stall, network blip) leaves a branch without
  # a fresh run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # pull_request_target must never cancel the untrusted validation run (or
  # vice versa): both events belong to the same PR but serve different trust
  # planes.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event_name != 'pull_request_target'
    name: Maintenance PR classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-validation: ${{ steps.classify.outputs.skip-validation }}
    steps:
      - name: Read Dependabot update metadata
        id: dependabot
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Classify validation policy
        id: classify
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          skip_validation=false
          reason=ordinary-change
          if [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && ( "$PR_AUTHOR" == "github-actions[bot]" || "$PR_AUTHOR" == "app/github-actions" || "$PR_AUTHOR" == "jbdevprimary" ) && "$PR_HEAD_REF" == release-please--* ]]; then
            skip_validation=true
            reason=release-please
          elif [[ "$PR_AUTHOR" == "dependabot[bot]" && ( "$UPDATE_TYPE" == *:semver-minor || "$UPDATE_TYPE" == *:semver-patch ) ]]; then
            skip_validation=true
            reason=dependabot-non-major
          fi
          echo "skip-validation=$skip_validation" >> "$GITHUB_OUTPUT"
          echo "Validation policy: $reason"

  repository-policy:
    name: Repository Policy / gate
    # This trusted-base workflow never checks out or executes fork content. It
    # only prevents an external fork from changing control-plane files before
    # its untrusted validation run can be considered mergeable.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Trusted upstream PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: echo "Trusted upstream PR; external-fork control-plane policy does not apply."
      - name: Reject external control-plane changes
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const protectedPaths = [
              '.github/workflows/',
              '.github/actions/',
              '.github/dependabot.yml',
              '.coderabbit.yaml',
              'sonar-project.properties',
              'release-please-config.json',
              '.release-please-manifest.json',
              'docs/sourcey.config.ts',
              'docs/package.json',
            ];
            const changed = files
              .map(({ filename }) => filename)
              .filter((filename) => protectedPaths.some((path) =>
                path.endsWith('/') ? filename.startsWith(path) : filename === path,
              ));
            if (changed.length > 0) {
              core.setFailed(
                `External forks cannot modify trusted control-plane files: ${changed.join(', ')}`,
              );
            }

  verify:
    needs: classify
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validation intentionally bypassed for vetted maintenance PR
        if: needs.classify.outputs.skip-validation == 'true'
        run: echo "Release-please and Dependabot non-major PRs are vetted encapsulations of the existing process."
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm/action-setup reads the version from package.json#packageManager;
      # setup-node reads .nvmrc — the same two files mise.toml points local
      # dev at, so no version is duplicated between local and CI.
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install audio verification tools
        if: needs.classify.outputs.skip-validation != 'true'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Lockfile is in sync
        if: needs.classify.outputs.skip-validation != 'true'
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm verify

  compatibility:
    needs: classify
    if: github.event_name != 'pull_request_target'
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Deliberate version coverage, not hardcoding: earliest non-deprecated
        # LTS through latest stable (see package.json#engines for the floor).
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 26
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - name: Validation intentionally bypassed for vetted maintenance PR
        if: needs.classify.outputs.skip-validation == 'true'
        run: echo "Compatibility validation is not rerun for this vetted maintenance PR."
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm typecheck
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm test
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm build
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm check:imports

  docs:
    needs: classify
    if: github.event_name != 'pull_request_target'
    name: Sourcey Docs / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validation intentionally bypassed for vetted maintenance PR
        if: needs.classify.outputs.skip-validation == 'true'
        run: echo "Sourcey validation is not rerun for this vetted maintenance PR."
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and validate Sourcey docs
        if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm docs:validate

  dependency-review:
    needs: classify
    if: github.event_name == 'pull_request'
    name: Dependency Review / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validation intentionally bypassed for vetted maintenance PR
        if: needs.classify.outputs.skip-validation == 'true'
        run: echo "Dependency review is not rerun for this vetted maintenance PR."
      - name: Review dependency changes
        if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  sonarcloud:
    # SonarCloud is intentionally limited to trusted upstream code: scanner
    # analysis consumes a token and must never execute arbitrary fork content.
    needs: classify
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    name: SonarQube Cloud / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validation intentionally bypassed for vetted maintenance PR
        if: needs.classify.outputs.skip-validation == 'true'
        run: echo "SonarCloud analysis is not rerun for this vetted maintenance PR."
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - if: needs.classify.outputs.skip-validation != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install audio verification tools
        if: needs.classify.outputs.skip-validation != 'true'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Produce coverage for SonarQube Cloud
        if: needs.classify.outputs.skip-validation != 'true'
        run: pnpm coverage
      - name: Analyze with SonarQube Cloud
        if: needs.classify.outputs.skip-validation != 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
