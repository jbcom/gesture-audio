# Local dev only — CI uses the official actions/setup-node and
# pnpm/action-setup actions instead (see .github/workflows/*.yml).
# CI tests each supported Node major; local development defaults to .nvmrc.
#   - Node version:  .nvmrc
#   - pnpm version:  package.json #packageManager (pnpm/action-setup's default)
[tools]
node = "26" # placeholder; idiomatic_version_file_enable_tools resolves the
            # real version from .nvmrc

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
