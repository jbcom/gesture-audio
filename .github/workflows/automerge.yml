name: Automerge trusted maintenance PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  release-please:
    if: >-
      github.repository == 'jbcom/gesture-audio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge --delete-branch=false "$PR_URL"

  dependabot:
    if: >-
      github.repository == 'jbcom/gesture-audio' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Enable native auto-merge for minor or patch updates
        if: >-
          endsWith(steps.metadata.outputs.update-type, 'semver-minor') ||
          endsWith(steps.metadata.outputs.update-type, 'semver-patch')
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge --delete-branch=false "$PR_URL"
