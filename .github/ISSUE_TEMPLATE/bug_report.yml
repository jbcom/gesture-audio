name: Bug report
description: Report reproducible incorrect behavior in gesture-audio.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private URLs, audio, and credentials from reproductions.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the bus list, resolver options, sprite-map shape, and relevant code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and runtime
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      render: shell
