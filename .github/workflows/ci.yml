name: CI

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Lets `gh workflow run ci.yml --ref <branch>` re-fire CI when a transient
  # infra hiccup (runner queue stall, network blip) leaves a branch without
  # a fresh run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy / gate
    # This trusted-base workflow never checks out or executes fork content. It
    # only prevents an external fork from changing control-plane files before
    # its untrusted validation run can be considered mergeable.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject external control-plane changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const protectedPaths = [
              '.github/workflows/',
              '.github/actions/',
              '.github/dependabot.yml',
              '.coderabbit.yaml',
              'sonar-project.properties',
              'release-please-config.json',
              '.release-please-manifest.json',
              'docs/sourcey.config.ts',
              'docs/package.json',
            ];
            const changed = files
              .map(({ filename }) => filename)
              .filter((filename) => protectedPaths.some((path) =>
                path.endsWith('/') ? filename.startsWith(path) : filename === path,
              ));
            if (changed.length > 0) {
              core.setFailed(
                `External forks cannot modify trusted control-plane files: ${changed.join(', ')}`,
              );
            }

  verify:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm/action-setup reads the version from package.json#packageManager;
      # setup-node reads .nvmrc — the same two files mise.toml points local
      # dev at, so no version is duplicated between local and CI.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install audio verification tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm verify

  compatibility:
    if: github.event_name != 'pull_request_target'
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Deliberate version coverage, not hardcoding: earliest non-deprecated
        # LTS through latest stable (see package.json#engines for the floor).
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 26
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:imports

  docs:
    if: github.event_name != 'pull_request_target'
    name: Sourcey Docs / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build and validate Sourcey docs
        run: pnpm docs:validate

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency Review / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
